<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>費馬點探究：從實驗到證明</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 進行即時編譯 -->
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>

  <!-- 引入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@0.469.0"></script>

  <!-- 補充原專案依賴的自訂動畫效果 -->
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInLeft { from { transform: translateX(-1rem); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(1rem); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInBottom { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .animate-in.fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .slide-in-from-left-2 { animation: slideInLeft 0.4s ease-out forwards; }
    .slide-in-from-right-4 { animation: slideInRight 0.4s ease-out forwards; }
    .slide-in-from-bottom-2 { animation: slideInBottom 0.4s ease-out forwards; }
    .zoom-in { animation: zoomIn 0.4s ease-out forwards; }
    
    /* 避免觸控設備上不必要的捲動與選取 */
    .touch-none { touch-action: none; }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex items-start lg:items-center justify-center lg:py-8">
  <div id="root" class="w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==========================================
    // Lucide Icon 橋接器
    // ==========================================
    const createIcon = (iconName) => ({ size = 24, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[iconName]) {
          ref.current.innerHTML = '';
          const svg = window.lucide.createElement(window.lucide.icons[iconName]);
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          if (className) svg.setAttribute('class', className);
          ref.current.appendChild(svg);
        }
      }, [size, className]);
      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
    };

    // 初始化所有用到的圖示
    const CheckCircle = createIcon('CheckCircle');
    const ArrowRight = createIcon('ArrowRight');
    const ArrowLeft = createIcon('ArrowLeft');
    const RotateCcw = createIcon('RotateCcw');
    const MousePointer2 = createIcon('MousePointer2');
    const Ruler = createIcon('Ruler');
    const Star = createIcon('Star');
    const RefreshCw = createIcon('RefreshCw');
    const ZoomIn = createIcon('ZoomIn');
    const ZoomOut = createIcon('ZoomOut');
    const Move = createIcon('Move');
    const PenTool = createIcon('PenTool');
    const ClipboardList = createIcon('ClipboardList');
    const Plus = createIcon('Plus');
    const Search = createIcon('Search');
    const Trash2 = createIcon('Trash2');
    const Info = createIcon('Info');
    const Eye = createIcon('Eye');
    const EyeOff = createIcon('EyeOff');
    const HelpCircle = createIcon('HelpCircle');
    const AlertTriangle = createIcon('AlertTriangle');

    // ==========================================
    // 純數學輔助函式
    // ==========================================
    const dist = (p1, p2) => Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
    const toRad = (deg) => deg * Math.PI / 180;

    const rotatePointByAngle = (p, center, angleRad) => {
      const dx = p.x - center.x;
      const dy = p.y - center.y;
      return {
        x: center.x + dx * Math.cos(angleRad) - dy * Math.sin(angleRad),
        y: center.y + dx * Math.sin(angleRad) + dy * Math.cos(angleRad)
      };
    };

    const rotatePoint = (p, center, angleDeg) => {
      return rotatePointByAngle(p, center, toRad(angleDeg));
    };

    const getAngle = (p1, center, p2) => {
      const a = dist(center, p2);
      const b = dist(center, p1);
      const c = dist(p1, p2);
      if(a === 0 || b === 0) return 0;
      const val = (a*a + b*b - c*c) / (2*a*b);
      return Math.acos(Math.max(-1, Math.min(1, val))) * 180 / Math.PI;
    };

    const getExtVertex = (p1, p2, other) => {
       const mid = {x: (p1.x+p2.x)/2, y: (p1.y+p2.y)/2};
       const v = {x: p2.x-p1.x, y: p2.y-p1.y};
       const len = Math.sqrt(v.x**2+v.y**2);
       let n = {x: -v.y, y: v.x}; 
       const toOther = {x: other.x-mid.x, y: other.y-mid.y};
       if(n.x*toOther.x + n.y*toOther.y > 0) { n.x = -n.x; n.y = -n.y; }
       const h = len * Math.sqrt(3)/2;
       return {x: mid.x + n.x/len*h, y: mid.y + n.y/len*h};
    };

    const getLineIntersection = (p1, p2, p3, p4) => {
        const d = (p1.x-p2.x)*(p3.y-p4.y) - (p1.y-p2.y)*(p3.x-p4.x);
        if(d===0) return null;
        const t = ((p1.x-p3.x)*(p3.y-p4.y) - (p1.y-p3.y)*(p3.x-p4.x))/d;
        return {x: p1.x + t*(p2.x-p1.x), y: p1.y + t*(p2.y-p1.y)};
    };

    // ==========================================
    // 核心元件
    // ==========================================
    const FermatGuidedTour = () => {
      // --- 狀態管理 ---
      const canvasRef = useRef(null);
      const containerRef = useRef(null); 
      const [size, setSize] = useState({ width: 800, height: 600 });
      const [step, setStep] = useState(1); 
      const [maxStepReached, setMaxStepReached] = useState(1); 

      // 視圖控制
      const [scale, setScale] = useState(1);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [lastPanPoint, setLastPanPoint] = useState({ x: 0, y: 0 });

      // 幾何資料
      // 所有幾何座標都在 800 × 600 的「世界座標」裡，再依畫面大小自動縮放置中
      const WORLD = { w: 800, h: 600 };
      const defaultVertices = {
        A: { x: 380, y: 130 },
        B: { x: 220, y: 440 },
        C: { x: 600, y: 440 },
      };
      const defaultP = { x: 430, y: 330 };
      const [vertices, setVertices] = useState(defaultVertices);
      const [pPoint, setPPoint] = useState(defaultP);
      
      // Step 5 專用：角 A 度數控制
      const [angleAValue, setAngleAValue] = useState(130);

      // 互動狀態
      const [isDragging, setIsDragging] = useState(null);

      // 實驗數據記錄
      const [dataRecords, setDataRecords] = useState([]); 
      const [hasFoundOptimal, setHasFoundOptimal] = useState(false); 
      const [recordWarning, setRecordWarning] = useState('');
      const [dragWarning, setDragWarning] = useState('');

      // 後續步驟控制
      const [rotationAngle, setRotationAngle] = useState(0); 
      const [pivot, setPivot] = useState('C'); 
      
      // Step 4 & 5 控制
      const [constructionStep, setConstructionStep] = useState(0);
      const [showObtuseProof, setShowObtuseProof] = useState(false); 

      // --- 核心計算 ---
      const constructionPoints = useMemo(() => {
          const { A, B, C } = vertices;
          return {
              C_prime: getExtVertex(B, C, A), 
              A_prime: getExtVertex(A, C, B), 
              B_prime: getExtVertex(A, B, C), 
          };
      }, [vertices]);

      const isogonicCenter = useMemo(() => {
          const { A, B } = vertices;
          const { A_prime, B_prime } = constructionPoints;
          return getLineIntersection(A, constructionPoints.C_prime, B, A_prime); 
      }, [vertices, constructionPoints]);

      const exactFermat = useMemo(() => {
        const { A, B, C } = vertices;
        const angA = getAngle(B, A, C);
        const angB = getAngle(A, B, C);
        const angC = getAngle(A, C, B);
        
        if (angA >= 120) return { ...A, isVertex: true };
        if (angB >= 120) return { ...B, isVertex: true };
        if (angC >= 120) return { ...C, isVertex: true };

        if (isogonicCenter) return { ...isogonicCenter, isVertex: false };
        return { x: (A.x+B.x+C.x)/3, y: (A.y+B.y+C.y)/3, isVertex: false }; 
      }, [vertices, isogonicCenter]);

      const currentSum = dist(pPoint, vertices.A) + dist(pPoint, vertices.B) + dist(pPoint, vertices.C);
      const minSum = useMemo(() => 
        dist(exactFermat, vertices.A) + dist(exactFermat, vertices.B) + dist(exactFermat, vertices.C)
      , [exactFermat, vertices]);
      
      // 第 2、3 步：以 X 為中心，把 △MPX 旋轉，F 是固定不動的頂點
      // （中心 C：M = A、F = B；中心 B：M = C、F = A；中心 A：M = B、F = C）
      const PIVOTS = { C: { X: 'C', M: 'A', F: 'B' }, B: { X: 'B', M: 'C', F: 'A' }, A: { X: 'A', M: 'B', F: 'C' } };
      const rotInfo = useMemo(() => {
        const { X, M, F } = PIVOTS[pivot];
        const deg = step === 3 ? 60 : rotationAngle;
        const cX = vertices[X], cM = vertices[M], cF = vertices[F];
        const Mp = rotatePoint(cM, cX, deg), Pp = rotatePoint(pPoint, cX, deg);
        const FP = dist(cF, pPoint), PPp = dist(pPoint, Pp), PpMp = dist(Pp, Mp), FMp = dist(cF, Mp);
        const broken = FP + PPp + PpMp;
        return {
          X, M, F, deg, cX, cM, cF, Mp, Pp, FP, PPp, PpMp, FMp, broken,
          PX: dist(pPoint, cX), PM: dist(pPoint, cM),
          angFPX: getAngle(cF, pPoint, cX), angMPX: getAngle(cM, pPoint, cX),
          collinear: broken - FMp < 0.3,
        };
      }, [pivot, step, rotationAngle, vertices, pPoint]);

      // 第 5 步：∠A ≥ 120° 時，把 △APB 繞 A 旋轉 (180° − ∠A)，讓 B 落在 CA 的延長線上
      const obt = useMemo(() => {
        if (step !== 5) return null;
        const { A, B, C } = vertices;
        const ux = A.x - C.x, uy = A.y - C.y, ul = Math.hypot(ux, uy);
        const AB = dist(A, B);
        const Bp = { x: A.x + ux / ul * AB, y: A.y + uy / ul * AB };
        let th = Math.atan2(Bp.y - A.y, Bp.x - A.x) - Math.atan2(B.y - A.y, B.x - A.x);
        while (th > Math.PI) th -= 2 * Math.PI;
        while (th < -Math.PI) th += 2 * Math.PI;
        const Pp = rotatePointByAngle(pPoint, A, th);
        const PA = dist(pPoint, A), PB = dist(pPoint, B), PC = dist(pPoint, C), PPp = dist(pPoint, Pp);
        return { Bp, Pp, thDeg: Math.abs(th) * 180 / Math.PI, PA, PB, PC, PPp, PpBp: dist(Pp, Bp), BpC: dist(Bp, C), AB, AC: dist(A, C) };
      }, [step, vertices, pPoint]);

      useEffect(() => { fitView(); }, [size, step]);

      const diff = currentSum - minSum;
      const isOptimal = diff < 2; 

      const targetGood = 3;
      const targetPoor = 3;
      const goodCount = dataRecords.filter(r => r.isOptimal).length;
      const poorCount = dataRecords.filter(r => r.diff > 10).length;
      const canProceedStep1 = goodCount >= targetGood && poorCount >= targetPoor;

      useEffect(() => {
        if (step === 1 && isOptimal) {
            setHasFoundOptimal(true);
            if (canProceedStep1 && maxStepReached < 2) {
                setMaxStepReached(2);
            }
        }
      }, [step, isOptimal, canProceedStep1, maxStepReached]);

      useEffect(() => {
        const updateSize = () => {
          if (containerRef.current) {
            const { offsetWidth, offsetHeight } = containerRef.current;
            if (offsetWidth > 0 && offsetHeight > 0) {
                setSize({ width: offsetWidth, height: offsetHeight });
            }
          }
        };
        updateSize();
        const ro = new ResizeObserver(updateSize);
        if (containerRef.current) ro.observe(containerRef.current);
        return () => ro.disconnect();
      }, []);

      const fitView = () => {
        // 一般步驟看整個 800×600；第 4 步要把三個外接正三角形也放進畫面
        let b = { x0: 0, y0: 0, x1: WORLD.w, y1: WORLD.h };
        if (step === 4) {
          const pts = [vertices.A, vertices.B, vertices.C, constructionPoints.A_prime, constructionPoints.B_prime, constructionPoints.C_prime];
          b = { x0: Math.min(...pts.map(p => p.x)) - 30, y0: Math.min(...pts.map(p => p.y)) - 30,
                x1: Math.max(...pts.map(p => p.x)) + 30, y1: Math.max(...pts.map(p => p.y)) + 30 };
        }
        const s = Math.min(size.width / ((b.x1 - b.x0) * 1.08), size.height / ((b.y1 - b.y0) * 1.08));
        setScale(s);
        setOffset({ x: (size.width - (b.x0 + b.x1) * s) / 2, y: (size.height - (b.y0 + b.y1) * s) / 2 });
      };

      // 以畫面中心為基準縮放
      const zoomBy = (factor) => {
        const base = Math.min(size.width / WORLD.w, size.height / WORLD.h);
        const next = Math.max(base * 0.5, Math.min(base * 3, scale * factor));
        const cx = size.width / 2, cy = size.height / 2;
        setOffset(o => ({ x: cx - (cx - o.x) * next / scale, y: cy - (cy - o.y) * next / scale }));
        setScale(next);
      };

      const handleReset = () => {
          const cx = WORLD.w / 2;
          const cy = WORLD.h / 2;
          
          if (step === 5) {
              updateObtuseTriangle(130, cx, cy);
              setAngleAValue(130);
              setShowObtuseProof(false);
          } else {
              setVertices(defaultVertices);
              setPPoint(defaultP);
              setStep(1); 
              setMaxStepReached(1);
              setDataRecords([]);
              setHasFoundOptimal(false);
          }
          
          setIsDragging(null); 
          setRotationAngle(0); 
          setPivot('C');
          fitView();
          setConstructionStep(0);
          setRecordWarning('');
          setDragWarning('');
      };

      const updateObtuseTriangle = (angleDeg, cx, cy) => {
          const baseWidth = 360; 
          const B = { x: cx - baseWidth/2, y: cy + 100 };
          const C = { x: cx + baseWidth/2, y: cy + 100 };
          
          const halfBase = baseWidth / 2;
          const angleRad = toRad(angleDeg);
          const height = halfBase / Math.tan(angleRad / 2);
          
          const A = { x: cx, y: B.y - height };
          
          setVertices({ A, B, C });
          setPPoint({ x: A.x, y: A.y + 40 });
      };

      useEffect(() => {
          if (step === 5) {
              updateObtuseTriangle(130, WORLD.w / 2, WORLD.h / 2);
              setAngleAValue(130);
              setShowObtuseProof(false);
          } else if (step < 4) {
              // 第 1~3 步固定使用同一個銳角三角形，讓記錄的數據可以互相比較
              setVertices(defaultVertices);
          }
      }, [step]); 

      const handleAngleChange = (e) => {
          const deg = parseInt(e.target.value);
          setAngleAValue(deg);
          updateObtuseTriangle(deg, WORLD.w / 2, WORLD.h / 2);
      };

      const recordData = () => {
          setRecordWarning('');
          if (dataRecords.length > 0) {
              const lastRecord = dataRecords[0];
              if (dist(pPoint, lastRecord.p) < 5) {
                  setRecordWarning('請移動 P 點後再記錄');
                  return;
              }
          }
          const angAPB = getAngle(vertices.A, pPoint, vertices.B);
          const angBPC = getAngle(vertices.B, pPoint, vertices.C);
          const angCPA = getAngle(vertices.C, pPoint, vertices.A);
          
          const newRecord = {
              id: Date.now(),
              p: { ...pPoint }, 
              sum: currentSum,
              diff: currentSum - minSum,
              angles: [angAPB, angBPC, angCPA],
              isOptimal: isOptimal
          };
          
          const newDataRecords = [newRecord, ...dataRecords];
          setDataRecords(newDataRecords);
          if (newRecord.isOptimal) {
              setHasFoundOptimal(true);
          }
      };

      const screenToWorld = (sx, sy) => {
        return {
            x: (sx - offset.x) / scale,
            y: (sy - offset.y) / scale
        };
      };

      // --- 繪圖邏輯 ---
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(size.width * dpr);
        canvas.height = Math.round(size.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, size.width, size.height);
        const px = 1 / scale; // 1 個螢幕像素在世界座標中的長度：讓線寬、點、字不隨縮放變大變小
        
        ctx.save();
        ctx.translate(offset.x, offset.y);
        ctx.scale(scale, scale);

        const drawLine = (p1, p2, color='#94a3b8', width=1, dash=[]) => {
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = color; ctx.lineWidth = width * px; ctx.setLineDash(dash.map(d => d * px)); ctx.stroke(); ctx.setLineDash([]);
        };
        const drawDot = (p, color, r=5) => {
          ctx.beginPath(); ctx.arc(p.x, p.y, r * px, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
        };
        const drawText = (txt, p, offset={x:0,y:0}, color='#334155', font='14px sans-serif') => {
          ctx.fillStyle = color; ctx.font = font.replace(/([\d.]+)px/, (m, n) => (n * px) + 'px'); ctx.fillText(txt, p.x + offset.x * px, p.y + offset.y * px);
        };

        const { A, B, C } = vertices;
        const { A_prime, B_prime, C_prime } = constructionPoints; 

        const isRotating = step === 2 || step === 3;
        
        if (!isRotating) {
            drawLine(A, B, '#334155', 2);
            drawLine(B, C, '#334155', 2);
            drawLine(C, A, '#334155', 2);
        } else {
            if (pivot === 'C') { drawLine(B, C, '#334155', 2); drawLine(A, C, '#94a3b8', 1, [5,5]); drawLine(A, B, '#cbd5e1', 1); }
            else if (pivot === 'B') { drawLine(A, B, '#334155', 2); drawLine(B, C, '#94a3b8', 1, [5,5]); drawLine(A, C, '#cbd5e1', 1); }
            else { drawLine(A, C, '#334155', 2); drawLine(A, B, '#94a3b8', 1, [5,5]); drawLine(B, C, '#cbd5e1', 1); }
        }

        drawDot(A, '#ef4444'); drawText('A', A, {x:-10,y:-10});
        drawDot(B, '#10b981'); drawText('B', B, {x:-20,y:20});
        drawDot(C, '#f59e0b'); drawText('C', C, {x:10,y:20});

        // Step 1
        if (step === 1) {
            drawLine(pPoint, A, '#3b82f6', 1.5);
            drawLine(pPoint, B, '#3b82f6', 1.5);
            drawLine(pPoint, C, '#3b82f6', 1.5);
            
            const pColor = isOptimal ? '#059669' : '#2563eb';
            drawDot(pPoint, pColor, 6);
            drawText('P', pPoint, {x:10,y:0}, pColor);
        }

        const fillTri = (pts, color) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); };
        const bold = 'bold 15px sans-serif';

        // Step 2 & 3
        if (step === 2 || step === 3) {
            const R = rotInfo;
            const { cX, cM, cF, Mp, Pp } = R;
            const full = R.deg === 60;
            fillTri([cX, cM, pPoint], 'rgba(59,130,246,0.07)');
            fillTri([cX, Mp, Pp], 'rgba(249,115,22,0.12)');
            if (full) {
                // △X M M' 是正三角形：M' 的位置和 P 無關
                fillTri([cX, cM, Mp], 'rgba(16,185,129,0.06)');
                drawLine(cM, Mp, '#10b981', 1.2, [4, 4]);
                drawLine(cX, Mp, '#10b981', 1.2, [4, 4]);
                // △X P P' 是正三角形
                fillTri([cX, pPoint, Pp], 'rgba(5,150,105,0.18)');
                // 目標：直線 F M'
                drawLine(cF, Mp, R.collinear ? '#dc2626' : '#fca5a5', 1.5, [6, 5]);
                // 相等的線段用同一個顏色
                drawLine(cX, pPoint, '#059669', 3);
                drawLine(pPoint, Pp, '#059669', 3);
                drawLine(pPoint, cM, '#ea580c', 3);
                drawLine(Pp, Mp, '#ea580c', 3);
                drawLine(cF, pPoint, '#2563eb', 3);
            } else {
                drawLine(cF, pPoint, '#2563eb', 3);
                drawLine(pPoint, Pp, '#2563eb', 3);
                drawLine(Pp, Mp, '#2563eb', 3);
            }
            drawDot(pPoint, '#2563eb', 6); drawText('P', pPoint, {x:-16,y:-8}, '#2563eb', bold);
            drawDot(Pp, '#2563eb', 4); if (full) drawText("P'", Pp, {x:8,y:16}, '#2563eb', bold);
            drawDot(Mp, '#ea580c', 5); if (full) drawText(R.M + "'", Mp, {x:8,y:-8}, '#ea580c', bold);
        }

        // Step 4
        if (step === 4) {
            const drawPoly = (pts, color) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.forEach(p=>ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.fillStyle=color; ctx.fill(); ctx.strokeStyle=color.replace('0.1','1'); ctx.setLineDash([2 * px, 2 * px]); ctx.lineWidth = 1 * px; ctx.stroke(); ctx.setLineDash([]); };
            
            const drawRotationTrace = (center, start, end) => {
                const angleStart = Math.atan2(start.y - center.y, start.x - center.x);
                const angleEnd = Math.atan2(end.y - center.y, end.x - center.x);
                ctx.beginPath();
                ctx.arc(center.x, center.y, dist(center, start), angleStart, angleEnd, Math.abs(angleStart - angleEnd) > Math.PI ? angleStart < angleEnd : angleStart > angleEnd); 
                ctx.strokeStyle = '#3b82f6'; ctx.setLineDash([4 * px, 4 * px]); ctx.lineWidth = 1 * px; ctx.stroke(); ctx.setLineDash([]);
            };

            const drawRotatedTriangle = (origin, center, targetEqVertex) => {
                const angleRad = Math.atan2(targetEqVertex.y - center.y, targetEqVertex.x - center.x) - Math.atan2(origin.y - center.y, origin.x - center.x);
                const pRot = rotatePointByAngle(exactFermat, center, angleRad);
                const originRot = targetEqVertex; 
                
                ctx.beginPath(); ctx.moveTo(exactFermat.x, exactFermat.y); ctx.lineTo(center.x, center.y); ctx.lineTo(origin.x, origin.y); ctx.closePath();
                ctx.fillStyle = 'rgba(59, 130, 246, 0.1)'; ctx.fill(); 
                
                ctx.beginPath(); ctx.moveTo(pRot.x, pRot.y); ctx.lineTo(center.x, center.y); ctx.lineTo(originRot.x, originRot.y); ctx.closePath();
                ctx.fillStyle = 'rgba(249, 115, 22, 0.2)'; ctx.fill(); 
                
                drawRotationTrace(center, exactFermat, pRot);
                drawDot(pRot, '#ea580c', 3);
            };

            if (constructionStep >= 1) {
                drawPoly([B, C, C_prime], 'rgba(16, 185, 129, 0.1)'); 
                drawDot(C_prime, '#059669', 3); drawText("C'", C_prime, {x:5,y:5}, '#059669');
                drawLine(A, C_prime, '#ef4444', 1.5); 
                if (exactFermat.isVertex === false) drawRotatedTriangle(C, B, C_prime);
            }
            
            if (constructionStep >= 2) {
                drawPoly([A, C, A_prime], 'rgba(16, 185, 129, 0.1)'); 
                drawDot(A_prime, '#059669', 3); drawText("A'", A_prime, {x:5,y:5}, '#059669');
                drawLine(B, A_prime, '#ef4444', 1.5); 
                if (exactFermat.isVertex === false) drawRotatedTriangle(A, C, A_prime);
                
                if (exactFermat.isVertex === false) {
                    drawDot(exactFermat, '#ef4444', 5); 
                    drawText("O", exactFermat, {x: 8, y: -8}, '#ef4444');
                }
            }

            if (constructionStep >= 3) {
                drawPoly([A, B, B_prime], 'rgba(16, 185, 129, 0.1)'); 
                drawDot(B_prime, '#059669', 3); drawText("B'", B_prime, {x:5,y:5}, '#059669');
                drawLine(C, B_prime, '#ef4444', 1.5);
                if (exactFermat.isVertex === false) drawRotatedTriangle(B, A, B_prime);
            }
        }

        // Step 5
        if (step === 5) {
            drawLine(pPoint, A, '#3b82f6', 1.5);
            drawLine(pPoint, B, '#3b82f6', 1.5);
            drawLine(pPoint, C, '#3b82f6', 1.5);
            
            if (isogonicCenter) {
                drawDot(isogonicCenter, '#9ca3af', 4);
                drawText("O", isogonicCenter, {x:10,y:0}, '#9ca3af');
                ctx.setLineDash([4 * px, 4 * px]);
                drawLine(A, isogonicCenter, '#cbd5e1');
                drawLine(B, isogonicCenter, '#cbd5e1');
                drawLine(C, isogonicCenter, '#cbd5e1');
                ctx.setLineDash([]);
            }

            drawDot(A, '#ef4444', 6);
            drawText("Min (A)", A, {x:-10, y:-30}, '#dc2626'); 

            const pColor = isOptimal ? '#059669' : '#2563eb';
            drawDot(pPoint, pColor, 6);
            drawText('P', pPoint, {x:10,y:0}, pColor);

            if (showObtuseProof && obt) {
                const { Bp, Pp } = obt;
                fillTri([A, pPoint, B], 'rgba(59,130,246,0.08)');
                fillTri([A, Pp, Bp], 'rgba(249,115,22,0.15)');
                drawLine(A, Bp, '#94a3b8', 1, [4, 4]);          // CA 的延長線
                drawLine(Bp, C, '#dc2626', 1.5, [6, 5]);        // B'C = AB + AC
                drawLine(pPoint, B, '#ea580c', 3); drawLine(Pp, Bp, '#ea580c', 3);   // PB = P'B'
                drawLine(A, pPoint, '#059669', 1.5, [5, 4]); drawLine(A, Pp, '#059669', 1.5, [5, 4]);
                drawLine(pPoint, Pp, '#059669', 3);             // PP' ≤ PA
                drawLine(pPoint, C, '#2563eb', 3);
                drawDot(Pp, '#2563eb', 4); drawText("P'", Pp, {x:8,y:16}, '#2563eb', bold);
                drawDot(Bp, '#ea580c', 5); drawText("B'", Bp, {x:-26,y:-8}, '#ea580c', bold);
            }
        }

        ctx.restore();
      }, [vertices, pPoint, step, isOptimal, rotationAngle, pivot, scale, offset, exactFermat, constructionStep, size, constructionPoints, showObtuseProof, isogonicCenter, rotInfo, obt]);

      // --- 互動邏輯 ---
      const handleMouseDown = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const worldPt = screenToWorld(sx, sy);

        let hitTarget = null;

        const allowVertexDrag = step === 4; // 第 1~3 步固定三角形；第 5 步改用角度滑桿
        const allowPDrag = step !== 4; // 第 4 步畫面上沒有 P 點

        if (allowPDrag && dist(worldPt, pPoint) < 30 / scale) hitTarget = 'P';
        else if (allowVertexDrag) {
             if (dist(worldPt, vertices.A) < 25 / scale) hitTarget = 'A';
             else if (dist(worldPt, vertices.B) < 25 / scale) hitTarget = 'B';
             else if (dist(worldPt, vertices.C) < 25 / scale) hitTarget = 'C';
        }

        if (hitTarget) {
            setIsDragging(hitTarget);
            setRecordWarning(''); 
        } else {
            setIsPanning(true);
            setLastPanPoint({ x: sx, y: sy });
        }
      };

      const handleMouseMove = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        
        if (isPanning) {
            const dx = sx - lastPanPoint.x;
            const dy = sy - lastPanPoint.y;
            setOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));
            setLastPanPoint({ x: sx, y: sy });
            return;
        }

        if (!isDragging) return;
        const worldPt = screenToWorld(sx, sy);

        if(isDragging === 'P') {
            setPPoint({x: worldPt.x, y: worldPt.y});
        } else {
            const next = { ...vertices, [isDragging]: { x: worldPt.x, y: worldPt.y } };
            const { A, B, C } = next;
            const angs = [getAngle(B, A, C), getAngle(A, B, C), getAngle(A, C, B)];
            const cross = (B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x);
            const minSide = Math.min(dist(A, B), dist(B, C), dist(C, A));
            if (Math.max(...angs) >= 118) {
                setDragWarning('三個內角都要小於 120°（大於等於 120° 的情形在第 5 步討論）');
            } else if (cross >= 0 || minSide < 60 || Math.min(...angs) < 8) {
                setDragWarning('三角形不能翻面或壓得太扁');
            } else {
                setDragWarning('');
                setVertices(next);
            }
        }
      };
      
      const handleMouseUp = () => {
        // 第 3 步：放開時若已經非常接近一直線，就把 P 吸到費馬點上，角度會剛好是 120°
        if (isDragging === 'P' && step === 3 && rotInfo.broken - rotInfo.FMp < 4 && !exactFermat.isVertex) {
            setPPoint({ x: exactFermat.x, y: exactFermat.y });
        }
        setIsDragging(null);
        setIsPanning(false);
        setDragWarning('');
      };

      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
            const touch = e.touches[0];
            handleMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
        }
      };

      const handleTouchMove = (e) => {
        if (e.touches.length === 1) {
            const touch = e.touches[0];
            handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        }
      };

      const handleTouchEnd = () => handleMouseUp();

      const StepButton = ({ num, title }) => (
          <button 
            onClick={() => { if(maxStepReached >= num) { setStep(num); if(num===2) setRotationAngle(0); } }}
            disabled={maxStepReached < num}
            className={`flex flex-col items-center z-10 w-1/5 transition-opacity ${maxStepReached >= num ? 'opacity-100 cursor-pointer' : 'opacity-50 cursor-not-allowed'}`}
          >
              <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold mb-1 transition-colors ${step >= num ? 'bg-blue-600 text-white' : (maxStepReached >= num ? 'bg-blue-200 text-blue-800' : 'bg-slate-200 text-slate-400')}`}>
                  {num}
              </div>
              <span className="text-xs font-bold text-slate-600 hidden sm:block text-center whitespace-nowrap px-1">{title}</span>
          </button>
      );

      return (
        <div className="flex flex-col items-center bg-slate-50 p-3 md:p-6 lg:rounded-xl shadow-lg w-full max-w-6xl mx-auto font-sans">
          <div className="w-full mb-4">
              <a href="./" className="inline-block text-sm font-semibold text-slate-500 hover:text-blue-600 mb-2">← 回作品集</a>
              <h2 className="text-xl md:text-2xl font-bold text-slate-800 text-center mb-4">費馬點探究：從實驗到證明</h2>
              <div className="flex justify-between relative mb-2 px-2 overflow-x-auto">
                  <StepButton num={1} title="實驗數據" />
                  <StepButton num={2} title="旋轉實驗" />
                  <StepButton num={3} title="幾何證明" />
                  <StepButton num={4} title="構造統整" />
                  <StepButton num={5} title="極端狀況" />
                  <div className="absolute top-4 left-0 w-full h-1 bg-slate-200 -z-0 mx-4" style={{width: 'calc(100% - 2rem)'}}>
                      <div className="h-full bg-blue-500 transition-all duration-500" style={{width: `${(maxStepReached-1)*25}%`}}></div>
                  </div>
              </div>
          </div>

          <div className="flex flex-col lg:flex-row w-full gap-4 lg:h-[600px]">
              <div ref={containerRef} className="relative border-2 border-slate-200 rounded-lg overflow-hidden bg-white shadow-inner cursor-crosshair touch-none h-[58vh] min-h-[340px] lg:h-auto lg:flex-1">
                <canvas 
                    ref={canvasRef}
                    style={{ width: '100%', height: '100%', display: 'block', touchAction: 'none' }}
                    onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                    onTouchStart={handleTouchStart}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleTouchEnd}
                    onTouchCancel={handleTouchEnd}
                />

                {step === 1 && (
                    <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-2 pointer-events-none">
                        {recordWarning && (
                            <div className="bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-bold shadow-md animate-bounce flex items-center gap-1">
                                <AlertTriangle size={14}/> {recordWarning}
                            </div>
                        )}
                        <button 
                            onClick={recordData}
                            className="px-6 py-3 bg-purple-600 text-white rounded-full font-bold shadow-lg hover:bg-purple-700 hover:scale-105 transition-all flex items-center gap-2 pointer-events-auto"
                        >
                            <Plus size={20}/> 記錄目前數據
                        </button>
                    </div>
                )}

                <div className="absolute bottom-4 right-4 flex flex-col gap-2 bg-white/90 p-2 rounded-lg shadow border border-slate-200 pointer-events-none">
                    <div className="pointer-events-auto flex flex-col gap-2">
                        <button onClick={()=>zoomBy(1.2)} className="p-1.5 hover:bg-slate-100 rounded" aria-label="放大"><ZoomIn size={20}/></button>
                        <button onClick={()=>zoomBy(1/1.2)} className="p-1.5 hover:bg-slate-100 rounded" aria-label="縮小"><ZoomOut size={20}/></button>
                        <button onClick={fitView} className="p-1.5 hover:bg-slate-100 rounded" aria-label="重置視角"><RefreshCw size={20}/></button>
                    </div>
                    <div className="p-1 text-slate-400 flex justify-center"><Move size={20}/></div>
                </div>

                {dragWarning && (
                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-amber-100 text-amber-800 border border-amber-300 px-3 py-1.5 rounded-full text-xs font-bold shadow pointer-events-none whitespace-nowrap max-w-[95%] overflow-hidden text-ellipsis">
                        {dragWarning}
                    </div>
                )}

                {(step === 2 || step === 3) && (
                    <div className="absolute top-4 left-4 bg-white/95 backdrop-blur p-4 rounded-lg shadow-lg border border-blue-100 max-w-xs animate-in fade-in slide-in-from-left-2 pointer-events-none hidden lg:block">
                        <div className="pointer-events-auto">
                            <h4 className="font-bold text-blue-800 mb-2 flex items-center gap-2"><RotateCcw size={16}/> 旋轉說明 (中心: {pivot})</h4>
                            <div className="text-sm text-slate-700 space-y-2">
                                <p>將 <span className="font-bold text-orange-600">△{pivot === 'C' ? 'APC' : pivot === 'B' ? 'BPC' : 'APB'}</span> 繞 {pivot} 點旋轉 {step===3?60:rotationAngle}°。</p>
                                {step === 3 && <p className="text-xs text-slate-500">相同顏色的線段一樣長，拖動 P 點試試看。</p>}
                            </div>
                        </div>
                    </div>
                )}

                <div className="absolute top-2 right-2 lg:top-4 lg:right-4 bg-white/95 backdrop-blur p-2 lg:p-3 rounded-lg border border-slate-200 shadow text-xs lg:text-sm font-mono text-slate-700 min-w-[150px] lg:min-w-[180px] pointer-events-none">
                     <div className="flex justify-between mb-1">
                         <span>目前總和:</span> 
                         <span className={`font-bold ${isOptimal?'text-green-600':'text-blue-600'}`}>{currentSum.toFixed(3)}</span>
                     </div>
                     <div className="flex justify-between border-t border-slate-200 pt-1 text-slate-500">
                         <span>目標極值:</span>
                         <span className="font-bold">{minSum.toFixed(3)}</span>
                     </div>
                </div>
              </div>

              <div className="w-full lg:w-80 flex flex-col gap-4 lg:overflow-y-auto">
                  
                  {step === 1 && (
                     <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-col h-full animate-in slide-in-from-right-4">
                         <div className="mb-4">
                             <h3 className="font-bold text-lg text-slate-800 mb-2 flex items-center gap-2"><Search size={20}/> 1. 實驗數據室</h3>
                             <div className="grid grid-cols-2 gap-2 mb-2">
                                 <div className={`p-2 rounded border text-center ${goodCount >= targetGood ? 'bg-green-100 border-green-300' : 'bg-slate-100'}`}>
                                     <div className="text-xs text-slate-500">良好數據</div>
                                     <div className={`font-bold ${goodCount >= targetGood ? 'text-green-700' : 'text-slate-700'}`}>{goodCount} / {targetGood}</div>
                                 </div>
                                 <div className={`p-2 rounded border text-center ${poorCount >= targetPoor ? 'bg-red-100 border-red-300' : 'bg-slate-100'}`}>
                                     <div className="text-xs text-slate-500">差異數據</div>
                                     <div className={`font-bold ${poorCount >= targetPoor ? 'text-red-700' : 'text-slate-700'}`}>{poorCount} / {targetPoor}</div>
                                 </div>
                             </div>
                             <p className="text-xs text-slate-500">請透過移動 P 點收集這兩種數據，觀察角度變化。</p>
                         </div>

                         <div className="flex-1 overflow-y-auto max-h-60 lg:max-h-none space-y-2 pr-1 border-t border-b border-slate-200 py-2 mb-2 bg-white rounded-md">
                             <div className="grid grid-cols-4 text-xs font-bold text-slate-500 px-2 pb-1 border-b">
                                 <span>總和</span>
                                 <span className="text-center">誤差</span>
                                 <span className="col-span-2 text-center">角度 (A/B/C)</span>
                             </div>
                             {dataRecords.length === 0 && (
                                 <div className="text-center text-slate-400 py-10 text-sm">
                                     尚未記錄數據<br/>試著移動 P 點並記錄
                                 </div>
                             )}
                             {dataRecords.map((rec) => (
                                 <div key={rec.id} className={`grid grid-cols-4 items-center p-2 rounded border text-xs ${rec.isOptimal ? 'bg-green-50 border-green-200' : rec.diff > 10 ? 'bg-red-50 border-red-200' : 'bg-white border-slate-100'}`}>
                                     <div className="font-mono font-bold text-slate-700">{rec.sum.toFixed(3)}</div>
                                     <div className={`text-center font-mono ${rec.isOptimal ? 'text-green-600 font-bold' : rec.diff > 10 ? 'text-red-500' : 'text-slate-500'}`}>
                                         {rec.isOptimal ? '✔' : `+${rec.diff.toFixed(1)}`}
                                     </div>
                                     <div className="col-span-2 text-center font-mono text-slate-500 flex justify-center gap-1">
                                         {rec.angles.map((a, idx) => (
                                             <span key={idx} className={Math.abs(a - 120) < 2 ? 'text-green-600 font-bold' : 'text-slate-400'}>
                                                 {a.toFixed(1)}
                                             </span>
                                         ))}
                                     </div>
                                 </div>
                             ))}
                         </div>

                         <div className="flex justify-between items-center">
                             <button onClick={() => setDataRecords([])} className="text-xs text-slate-400 hover:text-red-500 flex items-center gap-1">
                                 <Trash2 size={12}/> 清除
                             </button>
                             <button 
                                onClick={() => { setStep(2); setMaxStepReached(Math.max(maxStepReached, 2)); setRotationAngle(0); }}
                                disabled={!canProceedStep1}
                                className={`px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition-all ${canProceedStep1 ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-md' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                             >
                                {canProceedStep1 ? '下一步' : '收集更多數據'} <ArrowRight size={16}/>
                             </button>
                         </div>
                     </div>
                  )}

                  {step > 1 && step < 4 && (
                      <div className="bg-white border border-slate-200 rounded-lg p-5 lg:min-h-full flex flex-col shadow-sm animate-in fade-in">
                          <h3 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                              {step===2 ? <RotateCcw size={20}/> : <CheckCircle size={20}/>}
                              {step===2 ? '2. 旋轉實驗' : '3. 幾何證明'}
                          </h3>
                          
                          <div className="flex-1">
                              <div className="space-y-6">
                                  <div>
                                      <label className="text-xs font-bold text-slate-500 mb-2 block">選擇旋轉中心</label>
                                      <div className="flex gap-2">
                                          {['A', 'B', 'C'].map((pt) => (
                                              <button
                                                key={pt}
                                                onClick={() => { setPivot(pt); setRotationAngle(0); if(step===3) setStep(2); }}
                                                className={`flex-1 py-2 rounded border font-bold text-sm transition-all ${pivot === pt ? 'bg-orange-600 text-white border-orange-600' : 'bg-white text-slate-600 hover:bg-slate-50'}`}
                                              >
                                                  {pt} 點
                                              </button>
                                          ))}
                                      </div>
                                  </div>

                                  <div>
                                      <label className="text-xs font-bold text-slate-500 mb-2 block flex justify-between">
                                          <span>旋轉角度</span>
                                          <span className="text-orange-600 font-mono">{step===3 ? 60 : rotationAngle}°</span>
                                      </label>
                                      <input 
                                        type="range" min="0" max="60" value={step === 3 ? 60 : rotationAngle} 
                                        onChange={(e)=>{ setRotationAngle(parseInt(e.target.value)); if(step===3) setStep(2); }}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-orange-600"
                                      />
                                  </div>

                                  {step === 2 && (
                                      <div className="text-sm text-slate-700 bg-orange-50 border border-orange-100 rounded p-3 space-y-1.5">
                                          <p className="text-[11px] font-bold text-orange-700">講義任務 2</p>
                                          <p>把 △{rotInfo.M}P{rotInfo.X} 繞 {rotInfo.X} 點旋轉，拉到 60° 看看。</p>
                                          {rotationAngle === 60 && (
                                              <p className="font-bold text-slate-800">△{rotInfo.X}PP′ 是什麼三角形？為什麼要剛好轉 60°？換別的旋轉中心也一樣嗎？</p>
                                          )}
                                      </div>
                                  )}
                                  {step === 3 && (
                                      <div className="space-y-3 text-sm text-slate-700">
                                          <div className="rounded border border-emerald-200 bg-emerald-50 p-3 space-y-1">
                                              <p className="text-[11px] font-bold text-emerald-700">講義任務 3：{rotInfo.M}′ 會跟著動嗎？</p>
                                              <p>拖動 P 點時，{rotInfo.M}′ 的位置都不變。連接 {rotInfo.M}{rotInfo.M}′，△{rotInfo.X}{rotInfo.M}{rotInfo.M}′ 是正三角形（綠色虛線）。</p>
                                          </div>
                                          <div className="rounded border border-slate-200 p-3 space-y-1.5">
                                              <p className="text-[11px] font-bold text-blue-700">講義任務 4：為什麼這樣最小？</p>
                                              <p><span className="text-emerald-700 font-bold">綠色</span>：△{rotInfo.X}PP′ 是正三角形，所以 P{rotInfo.X} = PP′ <span className="font-mono text-xs text-slate-500">（{rotInfo.PX.toFixed(1)} = {rotInfo.PPp.toFixed(1)}）</span></p>
                                              <p><span className="text-orange-600 font-bold">橘色</span>：旋轉不改變長度，所以 P{rotInfo.M} = P′{rotInfo.M}′ <span className="font-mono text-xs text-slate-500">（{rotInfo.PM.toFixed(1)} = {rotInfo.PpMp.toFixed(1)}）</span></p>
                                              <p className="font-mono text-xs bg-slate-50 rounded p-2 leading-relaxed">
                                                  PA + PB + PC<br/>= {rotInfo.F}P + PP′ + P′{rotInfo.M}′ = {rotInfo.broken.toFixed(1)}<br/>≥ {rotInfo.F}{rotInfo.M}′ = {rotInfo.FMp.toFixed(1)}
                                              </p>
                                          </div>
                                          <div className={`rounded border p-3 space-y-1 ${rotInfo.collinear ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'}`}>
                                              {rotInfo.collinear ? (
                                                  <>
                                                      <p className="font-bold text-amber-800">{rotInfo.F}、P、P′、{rotInfo.M}′ 四點共線！</p>
                                                      <p>∠{rotInfo.F}P{rotInfo.X} = {rotInfo.angFPX.toFixed(1)}°，∠{rotInfo.M}P{rotInfo.X} = {rotInfo.angMPX.toFixed(1)}°</p>
                                                      <p className="text-xs text-slate-600">這就是第 1 步數據表裡看到的 120°。想想看：為什麼共線時這兩個角一定是 120°？</p>
                                                  </>
                                              ) : (
                                                  <p>拖動 P 點，把折線拉成一直線（目前還差 {(rotInfo.broken - rotInfo.FMp).toFixed(1)}）。</p>
                                              )}
                                          </div>
                                      </div>
                                  )}
                              </div>
                          </div>

                          <div className="mt-auto pt-4 border-t border-slate-100 flex justify-between gap-2">
                               <button onClick={handleReset} className="px-3 py-2 border rounded hover:bg-slate-50 text-slate-500 text-sm"><RefreshCw size={16}/></button>
                               {step === 2 && (
                                   <button 
                                      onClick={() => { setStep(3); setMaxStepReached(Math.max(maxStepReached, 3)); }} 
                                      disabled={rotationAngle < 60}
                                      className="flex-1 bg-blue-600 text-white rounded font-bold text-sm hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                      看證明結論
                                    </button>
                               )}
                               {step === 3 && (
                                   <button 
                                      onClick={() => { setStep(4); setMaxStepReached(Math.max(maxStepReached, 4)); setConstructionStep(0); }} 
                                      className="flex-1 bg-emerald-600 text-white rounded font-bold text-sm hover:bg-emerald-700"
                                    >
                                      最後統整
                                    </button>
                               )}
                          </div>
                      </div>
                  )}

                  {step === 4 && (
                      <div className="bg-white border border-slate-200 rounded-lg p-5 lg:min-h-full flex flex-col shadow-sm animate-in fade-in">
                          <h3 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                              <PenTool size={20}/> 4. 構造統整
                          </h3>
                          
                          <div className="flex-1 space-y-4">
                              {constructionStep === 0 && (
                                  <div className="space-y-4 animate-in fade-in">
                                      <p className="text-sm text-slate-600">
                                          首先，在 <span className="font-bold text-orange-600">BC</span> 邊外作正三角形。
                                          <br/>(回想：以 B 為中心旋轉時，最短路徑是 AC')
                                      </p>
                                      <button 
                                        onClick={() => setConstructionStep(1)}
                                        className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-md animate-in slide-in-from-bottom-2"
                                      >
                                          1. 畫出連線 AC'
                                      </button>
                                  </div>
                              )}

                              {constructionStep === 1 && (
                                  <div className="space-y-4 animate-in fade-in">
                                      <p className="text-sm text-slate-600">
                                          接著，在 <span className="font-bold text-orange-600">AC</span> 邊外作正三角形。
                                          <br/>(回想：以 C 為中心旋轉時，最短路徑是 BA')
                                      </p>
                                      <div className="p-3 bg-blue-50 border border-blue-100 rounded text-xs text-blue-800 mb-2">
                                          💡 提示：旋轉後的 A 點，位置剛好就是 A'！
                                      </div>
                                      <button 
                                        onClick={() => setConstructionStep(2)}
                                        className="w-full py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 transition-colors shadow-sm"
                                      >
                                          2. 畫出連線 BA'
                                      </button>
                                  </div>
                              )}

                              {constructionStep === 2 && (
                                  <div className="p-3 bg-purple-50 rounded border border-purple-100 text-sm animate-in fade-in">
                                      <p className="mb-2">現在有了交點 <span className="font-bold text-red-600">O</span>。</p>
                                      <p className="mb-2 text-slate-600">最後，在 <span className="font-bold text-orange-600">AB</span> 邊外作正三角形。</p>
                                      <p className="mb-2 font-bold text-purple-800 bg-white p-2 rounded border border-purple-200">
                                          關鍵探究：<br/>
                                          請試著拖動三角形頂點（三個角都保持小於 120°）。<br/>
                                          你覺得連線 CB' 會經過交點 O 嗎？
                                      </p>
                                      <button 
                                        onClick={() => setConstructionStep(3)}
                                        className="w-full py-2 bg-purple-600 text-white rounded font-bold hover:bg-purple-700 transition-colors shadow-sm flex items-center justify-center gap-2"
                                      >
                                          <HelpCircle size={16}/> 3. 畫線揭曉答案
                                      </button>
                                  </div>
                              )}

                              {constructionStep === 3 && (
                                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-lg animate-in zoom-in">
                                      <p className="text-emerald-800 text-sm font-bold flex items-center gap-2 mb-1">
                                          <CheckCircle size={16}/> 驗證成功：三線共點！
                                      </p>
                                      <p className="text-xs text-slate-600">
                                          三角形的三個角都小於 120° 時，這個交點 O 就是費馬點。
                                      </p>
                                  </div>
                              )}
                              {constructionStep === 3 && (
                                  <div className="bg-white border border-slate-200 rounded-lg p-3 text-sm text-slate-700 space-y-2">
                                      <p className="text-[11px] font-bold text-purple-700">講義任務 5</p>
                                      <p className="font-mono text-xs bg-slate-50 rounded p-2">
                                          AC′ = {dist(vertices.A, constructionPoints.C_prime).toFixed(1)}<br/>
                                          BA′ = {dist(vertices.B, constructionPoints.A_prime).toFixed(1)}<br/>
                                          CB′ = {dist(vertices.C, constructionPoints.B_prime).toFixed(1)}
                                      </p>
                                      <p><b>三段一樣長。</b>提示：比較 △C′CA 和 △BCA′，哪兩邊、哪個夾角相等？</p>
                                      <p><b>為什麼三線共點？</b>回想第 3 步：三個角都是 120° 的那個點，不論以 A、B 或 C 為中心旋轉，折線都會拉成直線，所以它同時在這三條線上。</p>
                                  </div>
                              )}
                          </div>

                          <div className="mt-auto pt-4 border-t border-slate-100 flex flex-wrap justify-center gap-2">
                               <button onClick={handleReset} className="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50 font-bold text-slate-600 flex items-center gap-2 whitespace-nowrap">
                                  <RefreshCw size={16}/> 重新開始探究
                               </button>
                               
                               {constructionStep > 0 && (
                                   <button onClick={() => setConstructionStep(s => s-1)} className="px-3 py-2 border rounded hover:bg-slate-50 text-slate-600 text-sm flex items-center gap-1 whitespace-nowrap">
                                       <ArrowLeft size={14}/> 上一步
                                   </button>
                               )}
                               
                               {constructionStep === 3 && (
                                   <button 
                                      onClick={() => { setStep(5); setMaxStepReached(5); }}
                                      className="px-3 py-2 bg-emerald-600 text-white rounded font-bold text-sm hover:bg-emerald-700 whitespace-nowrap"
                                    >
                                      下一步：極端狀況
                                    </button>
                               )}
                          </div>
                      </div>
                  )}

                  {step === 5 && (
                      <div className="bg-white border border-slate-200 rounded-lg p-5 lg:min-h-full flex flex-col shadow-sm animate-in fade-in">
                          <h3 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                              <AlertTriangle size={20}/> 5. 極端狀況
                          </h3>
                          
                          <div className="flex-1 space-y-4">
                              <div className="text-sm text-slate-600 bg-orange-50 p-3 rounded border border-orange-100">
                                  <p className="font-bold text-orange-800 mb-1">當 ∠A ≥ 120° 時…</p>
                                  <p>觀察畫面上的：</p>
                                  <ul className="list-disc list-inside pl-1 space-y-1">
                                      <li><span className="font-bold text-gray-500">灰色點 O</span>：理論交點 (跑去哪了？)</li>
                                      <li><span className="font-bold text-red-600">紅色點 Min</span>：實際最小值。</li>
                                  </ul>
                              </div>
                              
                              <div className="space-y-2">
                                  <label className="text-xs font-bold text-slate-500 flex justify-between">
                                      <span>調整角 A 度數</span>
                                      <span className="text-blue-600 font-mono">{angleAValue}°</span>
                                  </label>
                                  <input 
                                      type="range" min="120" max="175" value={angleAValue} 
                                      onChange={handleAngleChange}
                                      className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                  />
                              </div>

                              <div className="space-y-2">
                                  <button 
                                    onClick={() => setShowObtuseProof(!showObtuseProof)}
                                    className={`w-full py-3 px-4 rounded-lg border flex items-center justify-between transition-all ${showObtuseProof ? 'bg-blue-600 text-white border-blue-700' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}
                                  >
                                      <span className="font-bold">{showObtuseProof ? '隱藏旋轉觀點' : '顯示旋轉觀點'}</span>
                                      {showObtuseProof ? <EyeOff size={18}/> : <Eye size={18}/>}
                                  </button>
                              </div>

                              {showObtuseProof && obt && (
                                  <div className="text-sm text-slate-700 bg-blue-50 p-3 rounded border border-blue-100 space-y-1.5 animate-in fade-in">
                                      <p className="text-[11px] font-bold text-blue-700">講義任務 6</p>
                                      <p>這次不轉 60°，改把 △APB 繞 A 旋轉 180° − ∠A = <b>{obt.thDeg.toFixed(0)}°</b>，讓 B 剛好轉到 CA 延長線上的 B′。</p>
                                      <p><span className="text-orange-600 font-bold">橘色</span>：PB = P′B′</p>
                                      <p><span className="text-emerald-700 font-bold">綠色</span>：△APP′ 是等腰三角形，頂角 {obt.thDeg.toFixed(0)}° ≤ 60°，所以 PP′ ≤ PA <span className="font-mono text-xs text-slate-500">（{obt.PPp.toFixed(1)} ≤ {obt.PA.toFixed(1)}）</span></p>
                                      <p className="font-mono text-xs bg-white rounded p-2 leading-relaxed">
                                          PA + PB + PC = {(obt.PA + obt.PB + obt.PC).toFixed(1)}<br/>
                                          ≥ PP′ + P′B′ + PC = {(obt.PPp + obt.PpBp + obt.PC).toFixed(1)}<br/>
                                          ≥ B′C = AB + AC = {obt.BpC.toFixed(1)}
                                      </p>
                                      <p className="text-xs text-slate-600">要讓等號成立，PP′ 必須等於 PA。∠A &gt; 120° 時，只有 P 和 A 重合才做得到，所以最小值是 AB + AC，P 在頂點 A。（∠A 剛好 120° 時轉 60°，就回到第 3 步的情形。）</p>
                                  </div>
                              )}
                          </div>

                          <div className="mt-auto pt-4 border-t border-slate-100 flex flex-wrap justify-center gap-2">
                               <button onClick={handleReset} className="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50 font-bold text-slate-600 flex items-center gap-2 whitespace-nowrap">
                                  <RefreshCw size={16}/> 重新開始探究
                               </button>
                          </div>
                      </div>
                  )}
              </div>
          </div>
        </div>
      );
    };

    // 渲染應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FermatGuidedTour />);
  </script>
</body>
</html>
