<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>螺旋機器人：座標規律探究</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // 螺旋座標的數學
    // ==========================================
    // 第 n 步的座標
    const getCoords = (n) => {
      if (n === 1) return { x: 0, y: 0 };
      const k = Math.ceil((Math.sqrt(n) - 1) / 2);
      const prevSquare = (2 * k - 1) ** 2;
      const side = 2 * k;
      let pos = n - prevSquare;
      if (pos <= side) return { x: k, y: -(k - 1) + (pos - 1) };
      pos -= side;
      if (pos <= side) return { x: k - pos, y: k };
      pos -= side;
      if (pos <= side) return { x: -k, y: k - pos };
      pos -= side;
      if (pos <= side) return { x: -k + pos, y: -k };
      return { x: k, y: -k };
    };

    // 座標 (x, y) 是第幾步
    const getN = (x, y) => {
      const k = Math.max(Math.abs(x), Math.abs(y));
      if (k === 0) return 1;
      const prevSquare = (2 * k - 1) ** 2;
      const side = 2 * k;
      if (x === k && y > -k) return prevSquare + (y + k);
      if (y === k && x < k) return prevSquare + side + (k - x);
      if (x === -k && y < k) return prevSquare + 2 * side + (k - y);
      if (y === -k && x > -k) return prevSquare + 3 * side + (x + k);
      return (2 * k + 1) ** 2;
    };

    // 路徑只在轉角轉彎，所以只要畫轉角就好（第 k 圈的 5 個轉折）
    const cornersUpTo = (n) => {
      const list = [1];
      for (let k = 1; ; k++) {
        const cs = [(2*k-1)**2 + 1, 4*k*k - 2*k + 1, 4*k*k + 1, 4*k*k + 2*k + 1, (2*k+1)**2];
        for (const c of cs) { if (c > n) return list; list.push(c); }
      }
    };

    const PATTERNS = {
      topRight:    { label: '↗ 右上', quad: '第一象限', sides: 1, formula: '4k² − 2k + 1', at: (k) => ({ n: 4*k*k - 2*k + 1, x: k,  y: k  }) },
      topLeft:     { label: '↖ 左上', quad: '第二象限', sides: 2, formula: '4k² + 1',    at: (k) => ({ n: 4*k*k + 1,         x: -k, y: k  }) },
      bottomLeft:  { label: '↙ 左下', quad: '第三象限', sides: 3, formula: '4k² + 2k + 1', at: (k) => ({ n: 4*k*k + 2*k + 1,   x: -k, y: -k }) },
      bottomRight: { label: '↘ 右下', quad: '第四象限', sides: 4, formula: '(2k + 1)²',    at: (k) => ({ n: (2*k+1)**2,        x: k,  y: -k }) },
    };
    const PATTERN_ORDER = ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'];

    const MAX_N = 1000000;
    const clampN = (v) => Math.max(1, Math.min(MAX_N, v));
    const fmtNum = (n) => n.toLocaleString('en-US');

    // ==========================================
    // 一般式探究：學生輸入 n 用 k 表示的式子，自動檢查
    // ==========================================
    // 只接受數字、k、+ − × ÷ ^ 括號；支援 4k^2、2(k+1)²、(2k+1)^2 這類寫法
    const compileFormula = (src) => {
      let t = src.replace(/\s+/g, '').replace(/^n=/i, '').replace(/K/g, 'k')
        .replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/²/g, '^2').replace(/³/g, '^3');
      if (!t || /[^0-9k+\-*\/^().]/.test(t)) return null;
      t = t.replace(/(\d|\)|k)(?=[k(])/g, '$1*').replace(/\)(?=\d)/g, ')*');
      t = t.replace(/\^/g, '**');
      t = t.replace(/(^|[(+\-*\/])-([^+\-*\/()]+|\([^()]*\))\*\*/g, '$1-1*$2**'); // -k^2 → -1*k**2
      try {
        const f = new Function('k', '"use strict"; return (' + t + ');');
        if (typeof f(1) !== 'number') return null;
        return f;
      } catch (e) { return null; }
    };

    const FormulaLab = ({ pkey }) => {
      const [guess, setGuess] = useState('');
      const [result, setResult] = useState(null);
      const [hint, setHint] = useState(0); // 0 無提示、1 看差、2 從上一圈出發、3 答案
      useEffect(() => { setGuess(''); setResult(null); setHint(0); }, [pkey]);

      if (!pkey || pkey === 'none') {
        return <p className="text-sm text-slate-500">先在 ③ 選一個轉角，這裡會列出它的數據。</p>;
      }
      const p = PATTERNS[pkey];
      const rows = [1, 2, 3, 4, 5].map((k) => p.at(k));
      const d1 = rows.slice(1).map((r, i) => r.n - rows[i].n);
      const d2 = d1.slice(1).map((v, i) => v - d1[i]);

      const check = () => {
        const f = compileFormula(guess);
        if (!f) { setResult({ ok: false, msg: '看不懂這個式子。可以這樣寫：4k^2 + 3k − 1、(2k+1)^2' }); return; }
        for (let k = 1; k <= 12; k++) {
          const want = p.at(k).n, got = f(k);
          if (!Number.isFinite(got) || Math.abs(got - want) > 1e-9) {
            setResult({ ok: false, msg: `k = ${k} 時應該是 ${want}，你的式子算出 ${Number.isFinite(got) ? +got.toFixed(4) : '無法計算'}。` });
            return;
          }
        }
        setResult({ ok: true, msg: '正確！k = 1 到 12 全部都對。' });
      };

      const th = 'px-2 py-1.5 font-bold text-slate-500 text-xs whitespace-nowrap';
      const td = 'px-2 py-1.5 font-mono text-center';
      return (
        <div className="space-y-3">
          <p className="text-sm text-slate-600">
            {p.label}轉角的點落在 ({p.at(1).x > 0 ? 'k' : '−k'}, {p.at(1).y > 0 ? 'k' : '−k'})。它是第幾步？試著用 k 寫出 n 的一般式。
          </p>

          <div className="overflow-x-auto rounded-xl border border-slate-200">
            <table className="w-full text-sm bg-white">
              <thead className="bg-slate-50"><tr>
                <th className={th}>k</th>
                {rows.map((r, i) => <th key={i} className={th + ' text-center'}>{i + 1}</th>)}
              </tr></thead>
              <tbody>
                <tr className="border-t border-slate-100"><td className={th}>座標</td>{rows.map((r, i) => <td key={i} className={td + ' text-xs text-slate-500'}>({r.x},{r.y})</td>)}</tr>
                <tr className="border-t border-slate-100"><td className={th}>n</td>{rows.map((r, i) => <td key={i} className={td + ' font-bold text-rose-600'}>{r.n}</td>)}</tr>
                {hint >= 1 && <>
                  <tr className="border-t border-slate-100 bg-amber-50/60"><td className={th}>差</td><td></td>{d1.map((v, i) => <td key={i} className={td + ' text-amber-700'}>+{v}</td>)}</tr>
                  <tr className="border-t border-slate-100 bg-amber-50/60"><td className={th}>差的差</td><td></td><td></td>{d2.map((v, i) => <td key={i} className={td + ' text-amber-800 font-bold'}>+{v}</td>)}</tr>
                </>}
              </tbody>
            </table>
          </div>

          <div className="flex gap-2">
            <div className="flex-1 flex items-center border border-slate-300 rounded-xl bg-white focus-within:ring-2 focus-within:ring-rose-300 px-3">
              <span className="font-mono text-slate-500 mr-1">n =</span>
              <input value={guess} onChange={(e) => { setGuess(e.target.value); setResult(null); }}
                onKeyDown={(e) => e.key === 'Enter' && check()}
                placeholder="例如 4k^2 + 3k − 1" className="flex-1 min-w-0 py-2.5 font-mono outline-none bg-transparent" />
            </div>
            <button onClick={check} className="px-4 rounded-xl font-bold bg-rose-500 text-white hover:bg-rose-600 whitespace-nowrap">檢查</button>
          </div>
          {result && (
            <div className={`text-sm rounded-xl px-3 py-2 ${result.ok ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
              {result.ok ? '✓ ' : ''}{result.msg}
              {result.ok && hint < 2 && <div className="text-xs text-slate-600 mt-1">再想一步：為什麼會是這個式子？可以打開「提示 2」看看。</div>}
            </div>
          )}

          <div className="space-y-2 text-sm">
            {hint >= 1 && (
              <div className="rounded-xl bg-amber-50 border border-amber-200 p-3 text-slate-700">
                <b className="text-amber-800">提示 1：</b>相鄰兩項的差越來越大，但「差的差」固定不變，代表 n 是 k 的二次式：n = ak² + bk + c。用 k = 1、2、3 列方程式就能解出 a、b、c。
              </div>
            )}
            {hint >= 2 && (
              <div className="rounded-xl bg-sky-50 border border-sky-200 p-3 text-slate-700">
                <b className="text-sky-800">提示 2：</b>前一圈走完時停在右下角，編號是 (2k − 1)²。第 k 圈每一個邊要走 2k 步。從那裡走到{p.label}轉角，一共走了幾個邊？
              </div>
            )}
            {hint >= 3 && (
              <div className="rounded-xl bg-slate-800 text-white p-3">
                <b className="text-indigo-300">答案：</b>
                <span className="font-mono">n = (2k − 1)² + {p.sides} × 2k = {p.formula}</span>
              </div>
            )}
            {hint < 3 && (
              <button onClick={() => setHint(hint + 1)} className="text-sm font-bold text-slate-500 hover:text-rose-600">
                {['💡 給我提示 1', '💡 給我提示 2', '看答案'][hint]}
              </button>
            )}
          </div>
        </div>
      );
    };

    // ==========================================
    // 主程式
    // ==========================================
    const App = () => {
      const [targetInput, setTargetInput] = useState('2025');
      const [targetN, setTargetN] = useState(2025);
      const [currentN, setCurrentN] = useState(1);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speedLevel, setSpeedLevel] = useState(4);       // 0~8，對應每秒步數
      const [activePattern, setActivePattern] = useState('bottomRight');
      const [showNumbers, setShowNumbers] = useState(true);
      const [follow, setFollow] = useState(true);
      const [reverseX, setReverseX] = useState('3');
      const [reverseY, setReverseY] = useState('-2');
      const [view, setView] = useState({ cx: 0, cy: 0, zoom: 32 }); // 畫面中心的數學座標、每單位幾 px
      const [size, setSize] = useState({ w: 600, h: 400 });

      const STEPS_PER_SEC = [2, 5, 10, 25, 60, 150, 400, 1200, 4000];
      const stepsPerSec = STEPS_PER_SEC[speedLevel];

      const canvasRef = useRef(null);
      const boxRef = useRef(null);
      const viewRef = useRef(view);
      viewRef.current = view;

      // ---------- 畫布尺寸（跟著容器、支援高解析螢幕） ----------
      useEffect(() => {
        const el = boxRef.current;
        const ro = new ResizeObserver(() => setSize({ w: el.clientWidth, h: el.clientHeight }));
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      const toScreen = (x, y, v = view) => ({ sx: size.w / 2 + (x - v.cx) * v.zoom, sy: size.h / 2 - (y - v.cy) * v.zoom });

      // ---------- 拖曳、雙指縮放、滾輪 ----------
      const pointers = useRef(new Map());
      const pinchDist = useRef(null);

      const zoomAt = useCallback((factor, sx, sy) => {
        setView((v) => {
          const z = Math.max(0.3, Math.min(120, v.zoom * factor));
          const mx = v.cx + (sx - size.w / 2) / v.zoom;
          const my = v.cy - (sy - size.h / 2) / v.zoom;
          return { zoom: z, cx: mx - (sx - size.w / 2) / z, cy: my + (sy - size.h / 2) / z };
        });
      }, [size]);

      const localPt = (e) => {
        const r = canvasRef.current.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      const onPointerDown = (e) => {
        canvasRef.current.setPointerCapture(e.pointerId);
        pointers.current.set(e.pointerId, localPt(e));
      };
      const onPointerMove = (e) => {
        const ps = pointers.current;
        if (!ps.has(e.pointerId)) return;
        const prev = ps.get(e.pointerId);
        const cur = localPt(e);
        ps.set(e.pointerId, cur);
        if (ps.size === 1) {
          setFollow(false);
          setView((v) => ({ ...v, cx: v.cx - (cur.x - prev.x) / v.zoom, cy: v.cy + (cur.y - prev.y) / v.zoom }));
        } else if (ps.size === 2) {
          const [a, b] = [...ps.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (pinchDist.current) zoomAt(d / pinchDist.current, (a.x + b.x) / 2, (a.y + b.y) / 2);
          pinchDist.current = d;
        }
      };
      const onPointerUp = (e) => {
        pointers.current.delete(e.pointerId);
        if (pointers.current.size < 2) pinchDist.current = null;
      };
      useEffect(() => {
        const c = canvasRef.current;
        const onWheel = (e) => {
          e.preventDefault();
          const r = c.getBoundingClientRect();
          zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
        };
        c.addEventListener('wheel', onWheel, { passive: false });
        return () => c.removeEventListener('wheel', onWheel);
      }, [zoomAt]);

      // ---------- 行走動畫 ----------
      useEffect(() => {
        if (!isPlaying) return;
        let raf, last = performance.now(), carry = 0;
        const tick = (now) => {
          carry += (now - last) / 1000 * stepsPerSec;
          last = now;
          const steps = Math.floor(carry);
          if (steps > 0) {
            carry -= steps;
            setCurrentN((n) => {
              if (n === targetN) return n;
              return n < targetN ? Math.min(targetN, n + steps) : Math.max(targetN, n - steps);
            });
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [isPlaying, stepsPerSec, targetN]);

      useEffect(() => { if (isPlaying && currentN === targetN) setIsPlaying(false); }, [currentN, targetN, isPlaying]);

      // 跟隨機器人：機器人快走出畫面時，把它拉回中間
      useEffect(() => {
        if (!follow) return;
        const p = getCoords(currentN);
        const { sx, sy } = toScreen(p.x, p.y, viewRef.current);
        const m = 60;
        if (sx < m || sx > size.w - m || sy < m || sy > size.h - m) {
          setView((v) => ({ ...v, cx: p.x, cy: p.y }));
        }
      }, [currentN, follow, size]);

      // ---------- 繪圖 ----------
      useEffect(() => {
        const canvas = canvasRef.current;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(size.w * dpr);
        canvas.height = Math.round(size.h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const { w, h } = size;
        const { zoom } = view;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, w, h);

        const left = view.cx - w / 2 / zoom, right = view.cx + w / 2 / zoom;
        const bottom = view.cy - h / 2 / zoom, top = view.cy + h / 2 / zoom;
        const o = toScreen(0, 0);

        // 格線：間距至少約 48px
        let step = 1;
        for (const m of [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]) { step = m; if (m * zoom >= 48) break; }
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = Math.floor(left / step) * step; x <= right; x += step) { const s = toScreen(x, 0).sx; ctx.moveTo(s, 0); ctx.lineTo(s, h); }
        for (let y = Math.floor(bottom / step) * step; y <= top; y += step) { const s = toScreen(0, y).sy; ctx.moveTo(0, s); ctx.lineTo(w, s); }
        ctx.stroke();

        // 座標軸
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, o.sy); ctx.lineTo(w, o.sy);
        ctx.moveTo(o.sx, 0); ctx.lineTo(o.sx, h);
        ctx.stroke();

        // 刻度數字（軸跑出畫面時，貼在邊緣）
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.strokeStyle = 'rgba(248,250,252,0.95)';
        ctx.lineWidth = 4;
        const label = (t, x, y) => { ctx.strokeText(t, x, y); ctx.fillText(t, x, y); };
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const axisY = Math.min(Math.max(o.sy + 6, 4), h - 18);
        for (let x = Math.floor(left / step) * step; x <= right; x += step) if (x !== 0) label(x, toScreen(x, 0).sx, axisY);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        const axisX = Math.min(Math.max(o.sx - 6, 30), w - 4);
        for (let y = Math.floor(bottom / step) * step; y <= top; y += step) if (y !== 0) label(y, axisX, toScreen(0, y).sy);

        // 走過的路徑（只畫轉角）
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = Math.max(1.5, Math.min(4, zoom * 0.1));
        ctx.lineJoin = 'round';
        ctx.beginPath();
        const corners = cornersUpTo(currentN);
        corners.forEach((c, i) => { const p = getCoords(c); const s = toScreen(p.x, p.y); i ? ctx.lineTo(s.sx, s.sy) : ctx.moveTo(s.sx, s.sy); });
        const cur = getCoords(currentN);
        const cs = toScreen(cur.x, cur.y);
        ctx.lineTo(cs.sx, cs.sy);
        ctx.stroke();

        // 格點編號（放大時才顯示，只標走過的點）
        if (showNumbers && zoom >= 44) {
          ctx.font = `${Math.min(14, Math.round(zoom * 0.3))}px ui-monospace, monospace`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'bottom';
          ctx.fillStyle = '#475569';
          for (let x = Math.ceil(left); x <= Math.floor(right); x++) {
            for (let y = Math.ceil(bottom); y <= Math.floor(top); y++) {
              const n = getN(x, y);
              if (n > currentN) continue;
              const s = toScreen(x, y);
              ctx.beginPath(); ctx.arc(s.sx, s.sy, 2.5, 0, Math.PI * 2); ctx.fill();
              ctx.fillText(n, s.sx + 4, s.sy - 2);
            }
          }
        }

        // 轉角規律點
        if (activePattern !== 'none') {
          const pat = PATTERNS[activePattern];
          const kMax = Math.ceil(Math.max(Math.abs(left), Math.abs(right), Math.abs(top), Math.abs(bottom))) + 1;
          const r = Math.max(5, Math.min(9, zoom * 0.18));
          const labelEvery = Math.max(1, Math.ceil(70 / zoom));
          for (let k = 1; k <= kMax; k++) {
            const pt = pat.at(k);
            if (pt.x < left - 1 || pt.x > right + 1 || pt.y < bottom - 1 || pt.y > top + 1) continue;
            const s = toScreen(pt.x, pt.y);
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath(); ctx.arc(s.sx, s.sy, r, 0, Math.PI * 2); ctx.fill();
            if (k % labelEvery === 0 || k <= 3) {
              const tx = s.sx + r + 4, ty = s.sy;
              ctx.textBaseline = 'middle';
              ctx.textAlign = 'left';
              ctx.lineWidth = 4;
              ctx.strokeStyle = 'rgba(255,255,255,0.9)';
              ctx.font = 'bold 15px sans-serif';
              ctx.strokeText('A', tx, ty); ctx.fillStyle = '#be123c'; ctx.fillText('A', tx, ty);
              const aw = ctx.measureText('A').width;
              ctx.font = 'bold 11px sans-serif';
              ctx.strokeText(pt.n, tx + aw + 1, ty + 6); ctx.fillText(pt.n, tx + aw + 1, ty + 6);
            }
          }
        }

        // 機器人
        const rs = Math.max(14, Math.min(28, zoom * 0.6));
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(cs.sx - rs / 2, cs.sy - rs / 2, rs, rs, 4);
        ctx.fill();
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(cs.sx - rs * 0.2, cs.sy - rs * 0.1, rs * 0.11, 0, Math.PI * 2);
        ctx.arc(cs.sx + rs * 0.2, cs.sy - rs * 0.1, rs * 0.11, 0, Math.PI * 2);
        ctx.fill();
      }, [currentN, activePattern, view, size, showNumbers]);

      // ---------- 操作 ----------
      const applyTarget = () => {
        const v = clampN(parseInt(targetInput) || 1);
        setTargetInput(String(v));
        setTargetN(v);
        return v;
      };
      const walkToTarget = () => {
        if (isPlaying) { setIsPlaying(false); return; }
        const v = applyTarget();
        if (v !== currentN) { setFollow(true); setIsPlaying(true); }
      };
      const jumpToTarget = () => {
        const v = applyTarget();
        setIsPlaying(false);
        setCurrentN(v);
        const p = getCoords(v);
        setView((vw) => ({ ...vw, cx: p.x, cy: p.y }));
      };
      const resetWalk = () => { setIsPlaying(false); setCurrentN(1); setView((v) => ({ ...v, cx: 0, cy: 0 })); };

      const reverseTarget = () => {
        const x = parseInt(reverseX) || 0, y = parseInt(reverseY) || 0;
        const n = clampN(getN(x, y));
        setTargetN(n); setTargetInput(String(n));
        return { n, x, y };
      };
      const reverseWalk = () => { const { n } = reverseTarget(); setFollow(true); setIsPlaying(n !== currentN); };
      const reverseJump = () => { const { n, x, y } = reverseTarget(); setIsPlaying(false); setCurrentN(n); setView((v) => ({ ...v, cx: x, cy: y })); };

      const centerOrigin = () => setView({ cx: 0, cy: 0, zoom: 32 });
      const centerRobot = () => { const p = getCoords(currentN); setFollow(true); setView((v) => ({ ...v, cx: p.x, cy: p.y })); };

      const cur = getCoords(currentN);

      const btn = 'rounded-xl font-bold transition-colors active:scale-[0.98]';
      const input = 'w-full border border-slate-300 rounded-xl px-3 py-2.5 text-base font-mono focus:ring-2 outline-none bg-white';

      return (
        <div className="flex flex-col h-[100dvh] text-slate-900">
          {/* 標題列 */}
          <header className="bg-white border-b px-3 md:px-6 py-2.5 flex items-center gap-3 shadow-sm z-20 flex-none">
            <a href="./" className="text-sm font-semibold text-slate-500 hover:text-indigo-600 pr-3 border-r border-slate-200 whitespace-nowrap">← 作品集</a>
            <div className="min-w-0">
              <h1 className="text-base md:text-xl font-bold text-slate-800 truncate">螺旋機器人：座標規律探究</h1>
              <p className="text-xs text-slate-500 hidden md:block">機器人從原點出發，繞著方形螺旋一格一格往外走</p>
            </div>
          </header>

          <main className="flex flex-col md:flex-row flex-1 min-h-0">
            {/* 畫布 */}
            <div ref={boxRef} className="relative flex-none h-[52vh] md:h-auto md:flex-1 md:order-2 overflow-hidden border-b md:border-b-0 border-slate-200">
              <canvas
                ref={canvasRef}
                onPointerDown={onPointerDown}
                onPointerMove={onPointerMove}
                onPointerUp={onPointerUp}
                onPointerCancel={onPointerUp}
                className="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"
              />

              {/* 狀態卡 */}
              <div className="absolute top-3 left-3 bg-white/95 backdrop-blur shadow-lg rounded-2xl border border-slate-200 px-4 py-3 pointer-events-none">
                <div className="flex items-end gap-5">
                  <div>
                    <div className="text-xs font-bold text-slate-400 mb-0.5">第幾步</div>
                    <div className="text-2xl md:text-4xl font-black text-indigo-600 font-mono leading-none">
                      A<sub className="text-base md:text-xl">{currentN}</sub>
                    </div>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-slate-400 mb-0.5">座標</div>
                    <div className="text-2xl md:text-4xl font-black text-emerald-600 font-mono leading-none">({cur.x}, {cur.y})</div>
                  </div>
                </div>
              </div>

              {/* 視角按鈕 */}
              <div className="absolute bottom-3 right-3 flex flex-col gap-2">
                {[['＋', () => zoomAt(1.4, size.w / 2, size.h / 2), '放大'],
                  ['－', () => zoomAt(1 / 1.4, size.w / 2, size.h / 2), '縮小'],
                  ['⌂', centerOrigin, '回到原點'],
                  ['◎', centerRobot, '找機器人']].map(([t, fn, title]) => (
                  <button key={title} onClick={fn} title={title} aria-label={title}
                    className="w-11 h-11 rounded-full bg-white/95 border border-slate-300 shadow text-lg font-bold text-slate-700 hover:bg-indigo-50 active:scale-95">
                    {t}
                  </button>
                ))}
              </div>
              <div className="absolute bottom-3 left-3 text-[11px] text-slate-500 bg-white/80 rounded-full px-2.5 py-1 pointer-events-none hidden sm:block">
                拖曳平移・滾輪或雙指縮放・放大後可看到格點編號
              </div>
            </div>

            {/* 控制面板 */}
            <aside className="flex-1 md:flex-none md:w-[380px] md:order-1 bg-white md:border-r overflow-y-auto">
              <div className="p-4 md:p-5 space-y-5">

                <section className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                  <h2 className="font-bold text-indigo-700 mb-3">① 輸入 n，看機器人走到哪</h2>
                  <input type="number" inputMode="numeric" min="1" max={MAX_N} value={targetInput}
                    onChange={(e) => setTargetInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && walkToTarget()}
                    className={input + ' focus:ring-indigo-400 mb-2'} placeholder="例如 2025" />
                  <div className="grid grid-cols-5 gap-2">
                    <button onClick={walkToTarget} className={`${btn} col-span-2 py-2.5 text-white ${isPlaying ? 'bg-amber-500 hover:bg-amber-600' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                      {isPlaying ? '❚❚ 暫停' : '▶ 走過去'}
                    </button>
                    <button onClick={jumpToTarget} className={`${btn} col-span-2 py-2.5 bg-indigo-100 text-indigo-700 hover:bg-indigo-200`}>⚡ 直接跳</button>
                    <button onClick={resetWalk} title="回到起點" className={`${btn} py-2.5 bg-slate-200 text-slate-600 hover:bg-slate-300`}>↺</button>
                  </div>
                  <label className="block mt-3">
                    <div className="flex justify-between text-xs font-bold text-slate-500 mb-1">
                      <span>行走速度</span><span className="font-mono">每秒 {fmtNum(stepsPerSec)} 步</span>
                    </div>
                    <input type="range" min="0" max={STEPS_PER_SEC.length - 1} value={speedLevel}
                      onChange={(e) => setSpeedLevel(parseInt(e.target.value))} className="w-full accent-indigo-600" />
                  </label>
                </section>

                <section className="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100">
                  <h2 className="font-bold text-emerald-700 mb-3">② 反過來：給座標，找出 n</h2>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <label className="text-xs font-bold text-slate-500">x
                      <input type="number" inputMode="numeric" value={reverseX} onChange={(e) => setReverseX(e.target.value)} className={input + ' focus:ring-emerald-400 mt-1'} />
                    </label>
                    <label className="text-xs font-bold text-slate-500">y
                      <input type="number" inputMode="numeric" value={reverseY} onChange={(e) => setReverseY(e.target.value)} className={input + ' focus:ring-emerald-400 mt-1'} />
                    </label>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={reverseWalk} className={`${btn} py-2.5 bg-emerald-100 text-emerald-800 hover:bg-emerald-200`}>▶ 走過去</button>
                    <button onClick={reverseJump} className={`${btn} py-2.5 bg-emerald-600 text-white hover:bg-emerald-700`}>⚡ 直接跳</button>
                  </div>
                  <p className="text-xs text-slate-500 mt-2">先自己算算看是第幾步，再按按鈕驗證。</p>
                </section>

                <section>
                  <h2 className="font-bold text-slate-700 mb-1">③ 四個轉角</h2>
                  <p className="text-xs text-slate-500 mb-2">點一個方向，畫面上會標出那個轉角的所有點。</p>
                  <div className="grid grid-cols-2 gap-2">
                    {PATTERN_ORDER.map((key) => {
                      const p = PATTERNS[key];
                      const on = activePattern === key;
                      return (
                        <button key={key} onClick={() => setActivePattern(on ? 'none' : key)}
                          className={`py-2.5 px-3 rounded-xl border text-left transition-all ${on ? 'bg-rose-50 border-rose-400 text-rose-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                          <div className="font-bold text-sm">{p.label}<span className="font-normal text-xs ml-1 opacity-70">{p.quad}</span></div>
                        </button>
                      );
                    })}
                  </div>
                  <label className="flex items-center gap-2 mt-3 text-sm text-slate-600">
                    <input type="checkbox" checked={showNumbers} onChange={(e) => setShowNumbers(e.target.checked)} className="w-4 h-4 accent-indigo-600" />
                    放大時顯示走過格點的編號
                  </label>
                </section>

                <section className="bg-rose-50/40 p-4 rounded-2xl border border-rose-100">
                  <h2 className="font-bold text-rose-700 mb-2">④ 找出一般式</h2>
                  <FormulaLab pkey={activePattern} />
                </section>
              </div>
            </aside>
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
